<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한국인을 위한 대만 주음부호(ㄅㄆㄇㄈ) 발음 연습. 기본 37자와 결합운 22가지, 다섯 성조, 일상 단어 105개를 다섯 가지 모드로 익힙니다.">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1016" media="(prefers-color-scheme: dark)">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="ㄅㄆㄇㄈ 발음도장">
<meta property="og:description" content="한국인을 위한 대만 주음부호 발음 연습">
<meta property="og:image" content="https://USERNAME.github.io/zhuyin-dojo/og.png">
<meta property="og:url" content="https://USERNAME.github.io/zhuyin-dojo/">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* Claude Artifact 실행 환경이 제공하던 기본 리셋 복원 */
  :root{
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body{ margin:0 }
  img{ max-width:100% }
  [hidden]{ display:none !important }
</style>
<title>ㄅㄆㄇㄈ 발음도장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 한 줄짜리 집중형 컬럼. 문제 카드는 대만 교과서처럼 한자 오른쪽에
   주음을 세로로 세우고 성조 부호를 그 오른쪽에 붙인다. 37개 기호표는
   조음 위치(성모·개음·운모)별로 색을 나눠 읽는다. */
:root{
  /* 색: 푸른기 도는 차가운 종이 바탕 + 역할별 3색(남빛 성모 / 호박 개음 / 자줏빛 운모) */
  --paper:#F1F3F6; --card:#FAFBFC; --raise:#FFFFFF;
  --ink:#141820; --ink-2:#4A5362; --ink-3:#7C8696;
  --line:#D9DEE6; --line-2:#C3CAD5;
  --r-init:#2A4E9E; --r-init-bg:#E4EAF7;
  --r-med:#9A6708;  --r-med-bg:#F6EBD5;
  --r-fin:#8A2E61;  --r-fin-bg:#F6E3EE;
  --ok:#0D6E55; --ok-soft:#DCEDE7; --ok-line:#86C2AF;
  --no:#B33521; --no-soft:#F7E2DC; --no-line:#E0A595;
  --shadow:0 1px 2px rgba(20,24,32,.05), 0 10px 26px -14px rgba(20,24,32,.24);
  /* 서체: 한자·주음은 명조(Noto Serif TC), UI 한국어는 Noto Sans KR, 병음은 모노 */
  --f-han:'Noto Serif TC',"Songti TC","PMingLiU",serif;
  --f-ui:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1016; --card:#141A22; --raise:#1A212B;
    --ink:#E6EBF2; --ink-2:#A2ADBC; --ink-3:#75808F;
    --line:#242D39; --line-2:#333E4C;
    --r-init:#89AAEE; --r-init-bg:#16233D;
    --r-med:#DFAE56;  --r-med-bg:#332814;
    --r-fin:#DD8CBD;  --r-fin-bg:#361C2C;
    --ok:#4FC6A4; --ok-soft:#0E2E27; --ok-line:#2A6859;
    --no:#EE7458; --no-soft:#361A14; --no-line:#7B3B2B;
    --shadow:0 1px 2px rgba(0,0,0,.42), 0 12px 30px -16px rgba(0,0,0,.72);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1016; --card:#141A22; --raise:#1A212B;
  --ink:#E6EBF2; --ink-2:#A2ADBC; --ink-3:#75808F;
  --line:#242D39; --line-2:#333E4C;
  --r-init:#89AAEE; --r-init-bg:#16233D;
  --r-med:#DFAE56;  --r-med-bg:#332814;
  --r-fin:#DD8CBD;  --r-fin-bg:#361C2C;
  --ok:#4FC6A4; --ok-soft:#0E2E27; --ok-line:#2A6859;
  --no:#EE7458; --no-soft:#361A14; --no-line:#7B3B2B;
  --shadow:0 1px 2px rgba(0,0,0,.42), 0 12px 30px -16px rgba(0,0,0,.72);
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.6; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 28px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px; margin:0 auto}

/* ---------- 머리말 ---------- */
.top{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:14px; padding-block:20px 13px; border-bottom:1px solid var(--line);
}
.brand{display:flex; flex-direction:column; gap:2px; min-width:0}
.brand .mark{
  font-family:var(--f-han); font-weight:700; font-size:27px;
  line-height:1; letter-spacing:.04em; color:var(--ink);
}
.brand .sub{font-size:10.5px; letter-spacing:.2em; color:var(--ink-3)}
.score{display:flex; gap:16px; text-align:right}
.score dl{margin:0}
.score dt{font-size:10px; letter-spacing:.12em; color:var(--ink-3)}
.score dd{
  margin:0; font-family:var(--f-mono); font-variant-numeric:tabular-nums;
  font-size:18px; font-weight:500; line-height:1.25; color:var(--ink);
}
.score dd.hot{color:var(--r-med)}

/* ---------- 모드 ---------- */
.modes{
  display:grid; grid-template-columns:repeat(5,1fr); gap:2px; margin-top:13px;
  background:var(--card); border:1px solid var(--line); border-radius:3px; padding:3px;
}
.modes button{
  min-width:0; appearance:none; cursor:pointer; border:0; border-radius:2px;
  padding:9px 2px 8px; background:transparent; color:var(--ink-2);
  font-family:var(--f-ui); font-size:12.5px; font-weight:500;
  letter-spacing:-.02em; white-space:nowrap;
  transition:background .15s, color .15s;
}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{background:var(--ink); color:var(--paper); font-weight:700}
.modes button[disabled]{opacity:.34; cursor:not-allowed}

/* ---------- 문제판 ---------- */
.stage{
  margin-top:13px; background:var(--card);
  border:1px solid var(--line-2); border-radius:3px;
  box-shadow:var(--shadow); padding:20px 16px 16px; position:relative; overflow:hidden;
}
.ask{
  position:relative; text-align:center; font-size:12px;
  letter-spacing:.1em; color:var(--ink-3); margin-bottom:12px;
}
.promptbox{position:relative; display:grid; place-items:center; min-height:132px}

/* 세로 주음 루비 — 대만 교과서 조판 */
.ruby{display:flex; flex-wrap:wrap; justify-content:center; gap:.2em; font-size:66px}
.zi{display:inline-flex; align-items:flex-start; gap:.04em}
.zi .han{font-family:var(--f-han); font-size:1em; line-height:1.04}
.zi .zb{
  position:relative; display:flex; flex-direction:column; align-items:center;
  font-family:var(--f-han); font-size:.27em; line-height:1.1;
  padding-top:.5em; padding-right:1em; white-space:nowrap;
}
.zi .zb .tn{position:absolute; right:.05em; bottom:0; font-size:1em}
.zi .zb .dt{position:absolute; left:50%; top:-.35em; transform:translateX(-50%)}
.ruby.noz .zb{display:none}
.ruby.sm{font-size:42px}

.bigsym{font-family:var(--f-han); font-size:92px; line-height:1; color:var(--ink)}
.bigsym.two{font-size:70px; letter-spacing:.02em}
.cm{color:var(--r-med)}
.cf{color:var(--r-fin)}
.bigpy{font-family:var(--f-mono); font-size:40px; line-height:1.15; color:var(--ink); text-align:center}
.bigko{font-family:var(--f-ui); font-weight:700; font-size:30px; line-height:1.3; text-align:center; letter-spacing:.02em}
.bignote{font-size:28px}

.subhint{text-align:center; min-height:21px; margin-top:8px; font-size:13px; color:var(--ink-2)}
.audiobtn{
  display:block; margin:10px auto 0; cursor:pointer;
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink-2);
  border-radius:999px; padding:7px 15px; font-family:var(--f-ui); font-size:13px;
  transition:border-color .15s, color .15s;
}
.audiobtn:hover{border-color:var(--r-init); color:var(--r-init)}

/* 도장 */
.seal{
  position:absolute; top:4px; right:0; width:50px; height:50px; border-radius:50%;
  display:grid; place-items:center; font-family:var(--f-han); font-weight:700; font-size:23px;
  border:2.5px solid var(--ok); color:var(--ok);
  opacity:0; transform:rotate(-13deg) scale(1.5); pointer-events:none;
}
.seal.no{border-color:var(--no); color:var(--no)}
.seal.show{animation:stamp .5s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes stamp{
  0%{opacity:0; transform:rotate(-13deg) scale(1.6)}
  55%{opacity:.95; transform:rotate(-13deg) scale(.94)}
  100%{opacity:.88; transform:rotate(-13deg) scale(1)}
}

/* ---------- 보기 ---------- */
.choices{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:15px}
.choice{
  position:relative; appearance:none; cursor:pointer; text-align:center;
  background:var(--raise); color:var(--ink);
  border:1px solid var(--line-2); border-radius:3px;
  padding:13px 9px; min-height:62px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--f-mono); font-size:19px; font-weight:500; min-width:0;
  transition:border-color .12s, background .12s, transform .08s;
}
.choice .num{position:absolute; left:7px; top:5px; font-family:var(--f-mono); font-size:10px; color:var(--ink-3)}
.choice.sym{font-family:var(--f-han); font-size:34px; font-weight:400; line-height:1}
.choice.zhu{font-family:var(--f-han); font-size:26px; font-weight:400; line-height:1.2; letter-spacing:.04em}
.choice .tm{color:var(--r-fin); font-size:1.35em; margin-left:.06em}
.choice.right .tm, .choice.wrong .tm{color:inherit}
.choice.han{font-family:var(--f-han); font-size:27px; font-weight:400; line-height:1.2}
.choice.ko{font-family:var(--f-ui); font-size:16px; font-weight:500; line-height:1.35; letter-spacing:-.01em}
.choice:hover:not(:disabled){border-color:var(--r-init)}
.choice:active:not(:disabled){transform:translateY(1px)}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.choice.wrong{background:var(--no-soft); border-color:var(--no); color:var(--no)}
.choice.dim{opacity:.4}
.choice:focus-visible{outline:2px solid var(--r-init); outline-offset:2px}

/* ---------- 해설 ---------- */
.reveal{position:relative; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
.revtop{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap}
.revtop .ruby{font-size:40px; justify-content:flex-start}
.revmeta{flex:1 1 150px; min-width:0}
.revmeta .py{
  display:inline-block; font-family:var(--f-mono); font-size:13.5px; color:var(--r-init);
  border:1px solid var(--r-init); border-radius:2px; padding:1px 7px;
}
.revmeta .mean{display:block; margin-top:5px; font-size:15px; font-weight:500}
.revmeta .rdline{
  display:block; font-family:var(--f-ui); font-size:13px; font-weight:400;
  color:var(--ink-2); margin-bottom:2px;
}
.revmeta .rdline b{font-family:var(--f-han); font-size:17px; color:var(--r-fin); font-weight:400}
.revmeta .rdline .alt{font-family:var(--f-mono); font-size:12px; color:var(--ink-3)}
.reveal p{margin:9px 0 0; font-size:13.5px; color:var(--ink-2)}
.reveal .tip{
  margin-top:9px; padding:8px 10px; border-radius:2px;
  background:var(--r-init-bg); border:1px solid var(--line);
  font-size:12.5px; color:var(--ink-2); line-height:1.6;
}
.tonebox{display:flex; align-items:center; gap:12px; margin-top:10px}
.tsvg{width:38px; height:46px; flex:none}
.tsvg line{stroke:var(--line-2); stroke-width:1.5}
.tsvg polyline{fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round}
.tsvg circle{fill:currentColor}
.tonebox .tmeta{min-width:0}
.tonebox .tname{font-weight:700; font-size:14px}
.tonebox .tdesc{font-size:12.5px; color:var(--ink-2)}
.nextrow{margin-top:13px}
.next{
  width:100%; appearance:none; cursor:pointer; border:0; border-radius:3px;
  background:var(--ink); color:var(--paper);
  font-family:var(--f-ui); font-size:14px; font-weight:700; padding:12px; letter-spacing:.04em;
}
.next:hover{opacity:.88}
.next:focus-visible{outline:2px solid var(--r-init); outline-offset:2px}

/* ---------- 범위 ---------- */
.tools{margin-top:15px}
.toolhead{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  font-size:11px; letter-spacing:.12em; color:var(--ink-3); margin-bottom:8px;
}
.linkbtn{
  appearance:none; border:0; background:none; cursor:pointer; white-space:nowrap;
  font-family:var(--f-ui); font-size:12px; letter-spacing:.03em;
  color:var(--r-init); border-bottom:1px solid var(--r-init); padding:0 0 1px;
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  appearance:none; cursor:pointer; border-radius:999px;
  border:1px solid var(--line-2); background:transparent; color:var(--ink-3);
  font-family:var(--f-ui); font-size:12.5px; padding:6px 13px; transition:all .13s;
}
.chip[aria-pressed="true"]{background:var(--r-init-bg); border-color:var(--r-init); color:var(--r-init); font-weight:500}
.chip .n{font-family:var(--f-mono); font-size:10.5px; opacity:.7; margin-left:4px}
.note{margin-top:10px; font-size:11.5px; color:var(--ink-3); line-height:1.6}
.note b{color:var(--ink-2)}

/* ---------- 자료 시트 ---------- */
.sheet{
  position:fixed; inset:0; z-index:40; overflow-y:auto; background:var(--paper);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
}
.sheethead{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:2;
  background:var(--paper); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding-block:16px 12px;
}
.sheethead h2{margin:0; font-family:var(--f-han); font-weight:700; font-size:19px; letter-spacing:.03em}
.closebtn{
  appearance:none; cursor:pointer; border:1px solid var(--line-2); background:var(--raise);
  color:var(--ink-2); border-radius:3px; font-family:var(--f-ui); font-size:13px;
  padding:7px 13px; white-space:nowrap;
}
.closebtn:hover{border-color:var(--r-init); color:var(--r-init)}
.seg{display:flex; gap:2px; margin-top:13px; background:var(--card); border:1px solid var(--line); border-radius:3px; padding:3px}
.seg button{
  flex:1; appearance:none; cursor:pointer; border:0; border-radius:2px; padding:8px;
  background:transparent; color:var(--ink-2); font-family:var(--f-ui); font-size:13px; font-weight:500;
}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper); font-weight:700}

.grouphead{
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
  margin:20px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line);
}
.grouphead h3{margin:0; font-family:var(--f-han); font-size:17px; font-weight:700; letter-spacing:.06em}
.grouphead .kr{font-size:12.5px; color:var(--ink-2); font-weight:500}
.grouphead .zh{font-size:11px; color:var(--ink-3); font-family:var(--f-han)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(164px,1fr)); gap:7px}
.cards.w{grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.lcard{
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--line-2);
  border-radius:3px; padding:9px 11px; display:flex; gap:11px; align-items:flex-start;
  cursor:pointer; text-align:left; font-family:var(--f-ui); color:var(--ink); transition:border-color .13s;
}
.lcard:hover{border-color:var(--r-init)}
.lcard.split{display:flex; flex-direction:column; padding:0; cursor:default}
.lcard .pmain{
  display:flex; gap:11px; align-items:flex-start; width:100%;
  padding:9px 11px; background:none; border:0; cursor:pointer;
  text-align:left; font-family:var(--f-ui); color:var(--ink); font-size:inherit;
}
.lcard .exbtn{
  display:block; width:100%; text-align:left; cursor:pointer;
  margin-top:auto; padding:6px 11px 7px; background:none; border:0;
  border-top:1px solid var(--line);
  font-family:var(--f-han); font-size:11.5px; color:var(--ink-3);
}
.lcard .exbtn:hover{color:var(--r-init)}
.lcard .rd{
  display:block; margin-top:3px; font-family:var(--f-han);
  font-size:13px; color:var(--r-fin); letter-spacing:.03em;
}
.lcard .rd .alt{font-family:var(--f-mono); font-size:11px; color:var(--ink-3); letter-spacing:0}
.lcard.comp{border-left-color:var(--r-med)}
.lcard.comp .g{font-size:25px; min-width:50px}
.lcard.init{border-left-color:var(--r-init)}
.lcard.med{border-left-color:var(--r-med)}
.lcard.fin{border-left-color:var(--r-fin)}
.lcard .g{font-family:var(--f-han); font-size:30px; line-height:1.1; min-width:32px; text-align:center}
.lcard.init .g{color:var(--r-init)}
.lcard.med .g{color:var(--r-med)}
.lcard.fin .g{color:var(--r-fin)}
.lcard .g.w{font-size:21px; min-width:52px; text-align:left}
.lcard .meta{min-width:0; flex:1}
.lcard .r{font-family:var(--f-mono); font-size:13px; color:var(--ink)}
.lcard .n{font-size:12px; color:var(--ink-3)}
.lcard .h{display:block; font-size:11.5px; color:var(--ink-2); margin-top:3px; line-height:1.5}
.lcard .ex{display:block; margin-top:4px; font-size:11.5px; color:var(--ink-3); font-family:var(--f-han)}
.bar{display:block; height:3px; border-radius:2px; background:var(--line); margin-top:7px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok); width:0}

/* 성조표 */
.trow{
  display:flex; align-items:center; gap:14px; padding:12px 12px;
  background:var(--card); border:1px solid var(--line); border-radius:3px; margin-bottom:7px;
}
.trow .tsvg{color:var(--r-init)}
.trow .tx{flex:1; min-width:0}
.trow .th{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.trow .th b{font-size:15px}
.trow .th .zh{font-family:var(--f-han); font-size:12.5px; color:var(--ink-3)}
.trow .th .mk{font-family:var(--f-han); font-size:15px; color:var(--r-fin)}
.trow .td{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.trow .tex{
  margin-top:6px; font-family:var(--f-han); font-size:14px; color:var(--ink);
  display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;
}
.trow .tex small{font-family:var(--f-ui); font-size:11.5px; color:var(--ink-3)}
.pairs{display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:7px}
.pair{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:10px 12px}
.pair .pt{font-size:12px; color:var(--ink-3); margin-bottom:5px}
.pair .pl{display:flex; gap:12px; flex-wrap:wrap}
.pair .pi{text-align:center}
.pair .pi b{display:block; font-family:var(--f-han); font-size:22px; font-weight:400; line-height:1.2}

<div class="wrap">

    <button type="button" data-mode="listen" aria-pressed="false" id="m-listen">듣기</button>
  </nav>

  <main class="stage">
    <div class="seal" id="seal" aria-hidden="true">正</div>
    <p class="ask" id="ask">이 기호는 어떤 소리인가요?</p>
    <div class="promptbox"><div id="prompt"></div></div>
    <p class="subhint" id="subhint"></p>
    <button type="button" class="audiobtn" id="play" hidden>다시 듣기　<span style="opacity:.55">R</span></button>

    <div class="choices" id="choices"></div>

    <div class="reveal" id="reveal" hidden>
      <div class="revtop">
        <div id="r-ruby"></div>
        <div class="revmeta">
          <span class="py" id="r-py"></span>
          <span class="mean" id="r-mean"></span>
        </div>
      </div>
      <div class="tonebox" id="r-tonebox" hidden>

      </div>

      <div class="tip" id="r-tip" hidden></div>
      <div class="nextrow"><button type="button" class="next" id="next">다음 문제　⏎</button></div>
    </div>
  </main>

  <section class="tools">
    <div class="toolhead">
      <span>출제 범위</span>
      <button type="button" class="linkbtn" id="openchart">주음표 · 성조 · 단어장</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="note" id="note">키보드: <b>1–4</b> 선택, <b>Enter</b> 다음 문제.</p>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="wrap">
    <div class="sheethead">

    <p class="legend" id="legend"></p>
  </div>
</div>

/* ============ 상태 ============ */
var STORE_KEY = 'zhuyin-dojo-v1';
var state = {
  mode:'sym',
  roleScope:{init:true, med:true, fin:true, comp:true},
  catScope:{greet:true, people:true, num:true, food:true, place:true, act:true},
  chartView:'sym',
  streak:0, best:0, count:0, right:0,
  q:null, locked:false
};
var mastery = {};

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && o.mastery) mastery = o.mastery;
    if (o && o.roleScope) Object.keys(state.roleScope).forEach(function(k){
      if (typeof o.roleScope[k] === 'boolean') state.roleScope[k] = o.roleScope[k];
    });
    if (o && o.catScope) Object.keys(state.catScope).forEach(function(k){
      if (typeof o.catScope[k] === 'boolean') state.catScope[k] = o.catScope[k];
    });
    if (o && typeof o.best === 'number') state.best = o.best;
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      mastery:mastery, roleScope:state.roleScope, catScope:state.catScope, best:state.best
    }));
  }catch(e){}
}
function record(key, ok){
  var m = mastery[key] || (mastery[key] = {n:0, r:0});
  m.n++; if (ok) m.r++;
  if (m.n > 12){ m.n = Math.round(m.n * 0.6); m.r = Math.round(m.r * 0.6); }
  save();
}

/* ============ 도구 ============ */
function $(id){ return document.getElementById(id); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function weightedPickBy(pool, keyFn){
  var bag = [];
  pool.forEach(function(it){
    var m = mastery[keyFn(it)], w = 3;
    if (m && m.n >= 2){ var acc = m.r / m.n; w = acc > 0.85 ? 1 : (acc > 0.6 ? 3 : 5); }
    for (var i = 0; i < w; i++) bag.push(it);
  });
  return pick(bag);
}
function symPool(){
  var p = SYMS.filter(function(s){ return state.roleScope[s.role] && !s.rare; });
  return p.length ? p : SYMS.filter(function(s){ return !s.rare; });
}
/* 結合韻은 介音(호박색) + 韻母(자주색) 로 나눠 칠해 구조가 보이게 한다 */
function glyphHTML(it){
  if (it.role !== 'comp') return it.ch;
  var a = Array.from(it.ch);
  return '<span class="cm">' + a[0] + '</span><span class="cf">' + a.slice(1).join('') + '</span>';
}
function wordPool(){
  var p = WORDS.filter(function(w){ return state.catScope[w.cat]; });
  return p.length ? p : WORDS.slice();
}
function tonePool(){
  var p = wordPool().filter(function(w){ return w.one; });
  if (p.length >= 6) return p;
  return WORDS.filter(function(w){ return w.one; });
}

/* ============ 주음 조판 ============ */
function parseSyl(s){
  var dot = false, tone = '';
  if (s.charAt(0) === '˙'){ dot = true; s = s.slice(1); }
  var last = s.charAt(s.length - 1);
  if ('ˊˇˋ'.indexOf(last) >= 0 && last !== ''){ tone = last; s = s.slice(0, -1); }
  return {sym:s, tone:tone, dot:dot};
}
/* 한자 오른쪽에 주음을 세로로, 성조는 그 오른쪽 아래에, 경성 점은 위에 */
function rubyHTML(han, zhu, cls){
  var syls = (zhu || '').trim().split(/\s+/);
  var out = '<div class="ruby' + (cls ? ' ' + cls : '') + '">';
  Array.from(han).forEach(function(c, i){
    var p = parseSyl(syls[i] || '');
    var col = '';
    Array.from(p.sym).forEach(function(z){ col += '<span>' + z + '</span>'; });
    out += '<span class="zi"><span class="han">' + c + '</span><span class="zb">' + col +
      (p.tone ? '<span class="tn">' + p.tone + '</span>' : '') +
      (p.dot ? '<span class="dt">˙</span>' : '') + '</span></span>';
  });
  return out + '</div>';
}
/* 五度標記法 — 1(낮음)~5(높음) 다섯 단계 높낮이 그래프 */
function toneSVG(contour){
  var y = function(l){ return 42 - (l - 1) * 9; };
  var inner;
  if (contour.length === 1){
    inner = '<circle cx="16" cy="' + y(contour[0]) + '" r="2.6"/>' +
            '<polyline points="9,' + y(contour[0]) + ' 23,' + y(contour[0]) + '"/>';
  } else {
    var step = 24 / (contour.length - 1);
    inner = '<polyline points="' + contour.map(function(l, i){
      return (6 + i * step).toFixed(1) + ',' + y(l);
    }).join(' ') + '"/>';
  }
  return '<svg class="tsvg" viewBox="0 0 40 48" aria-hidden="true">' +
         '<line x1="34" y1="6" x2="34" y2="42"/>' + inner + '</svg>';
}
/* 보기에서 성조 부호만 크게·색으로 도드라지게 (textContent 는 그대로 유지) */
function zhuOptHTML(s){
  var p = parseSyl(s);
  return (p.dot ? '<span class="tm">˙</span>' : '') + p.sym +
         (p.tone ? '<span class="tm">' + p.tone + '</span>' : '');
}
/* 성조 부호만 떼어낸 병음 — 어느 음절인지는 알려주되 성조는 감춘다 */
function stripTone(py){
  return py.normalize('NFD').replace(/[̄́̌̀]/g, '').normalize('NFC');
}

/* ============ 음성 ============ */
var zhVoice = null, ttsOK = false;
function findVoice(){
  try{
    if (!('speechSynthesis' in window)) return;
    var vs = window.speechSynthesis.getVoices() || [];
    var tw = null, any = null;
    vs.forEach(function(v){
      var lg = v.lang || '';
      if (/^zh[-_]?(TW|Hant)/i.test(lg) && !tw) tw = v;
      else if (/^zh/i.test(lg) && !any) any = v;
    });
    zhVoice = tw || any;
    var now = !!zhVoice;
    if (now !== ttsOK){ ttsOK = now; updateAudioUI(); }
  }catch(e){}
}
function speak(text){
  if (!ttsOK || !text) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.voice = zhVoice; u.lang = zhVoice.lang || 'zh-TW'; u.rate = 0.78;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function updateAudioUI(){

    ? '키보드: <b>1–4</b> 선택, <b>Enter</b> 다음 문제, <b>R</b> 다시 듣기.'
    : '키보드: <b>1–4</b> 선택, <b>Enter</b> 다음 문제. 이 기기에 중국어 음성이 없어 「듣기」는 쓸 수 없습니다. 나머지 모드는 그대로 쓸 수 있어요.';
  if (!ttsOK && state.mode === 'listen') setMode('sym');
  syncModes();
}
try{
  if ('speechSynthesis' in window){
    findVoice();
    window.speechSynthesis.onvoiceschanged = findVoice;
    setTimeout(findVoice, 400); setTimeout(findVoice, 1500);
  }
}catch(e){}

/* ============ 출제 ============ */
function distract(pool, target, keyFn, answer, sameFn){
  var seen = {}; seen[answer] = 1;
  var out = [answer];
  var take = function(list){
    shuffle(list.slice()).forEach(function(x){
      var k = keyFn(x);
      if (out.length < 4 && !seen[k]){ seen[k] = 1; out.push(k); }
    });
  };
  if (sameFn) take(pool.filter(function(x){ return sameFn(x) && keyFn(x) !== answer; }));
  take(pool.filter(function(x){ return keyFn(x) !== answer; }));
  return shuffle(out);
}

function symQuestion(){
  var pool = symPool();
  var t = weightedPickBy(pool, function(x){ return x.ch; });
  return {
    mode:'sym', key:t.ch, sym:t,
    ask:'이 기호는 어떤 소리인가요?',
    promptHTML:'<div class="bigsym' + (Array.from(t.ch).length > 1 ? ' two' : '') + '">' +
               glyphHTML(t) + '</div>',
    answer:t.py,
    options:distract(pool, t, function(x){ return x.py; }, t.py,
                     function(x){ return x.gid === t.gid; }),
    optionClass:'',
    audio:t.say
  };
}
function findQuestion(){
  var pool = symPool();
  var t = weightedPickBy(pool, function(x){ return x.ch; });
  return {
    mode:'find', key:t.ch, sym:t,
    ask:'이 소리를 적는 기호는?',
    promptHTML:'<div class="bigpy">' + t.py + '</div>',
    hint:t.ko === '(없음)' ? '한국어에 없는 소리입니다' : '한국어로는 ' + t.ko + '에 가깝습니다',
    answer:t.ch,
    options:distract(pool, t, function(x){ return x.ch; }, t.ch,
                     function(x){ return x.gid === t.gid; }),
    optionClass:'sym',
    audio:t.say
  };
}
function toneQuestion(){
  var pool = tonePool();
  var t = weightedPickBy(pool, function(x){ return x.h; });
  var base = parseSyl(t.z.trim());
  var opts = TONE_MARKS.map(function(m){ return base.sym + m; });
  if (opts.indexOf(t.z.trim()) === -1) opts[0] = t.z.trim();
  return {
    mode:'tone', key:t.h, word:t,
    ask:'이 글자의 성조는?',
    promptHTML:rubyHTML(t.h, t.z, 'noz'),
    hint:stripTone(t.py) + ' · 뜻 ' + t.m,
    answer:t.z.trim(),
    options:shuffle(opts.slice(0, 4)),
    optionClass:'zhu',
    optHTML:zhuOptHTML,
    audio:t.h
  };
}
function wordQuestion(){
  var pool = wordPool();
  var t = weightedPickBy(pool, function(x){ return x.h; });
  var roll = Math.random();
  var q = {mode:'word', key:t.h, word:t, audio:t.h};
  if (roll < 0.42){
    q.ask = '이 단어의 뜻은?';
    q.promptHTML = rubyHTML(t.h, t.z, 'noz');
    q.answer = t.m;
    q.options = distract(pool, t, function(x){ return x.m; }, t.m,
                         function(x){ return x.cat === t.cat; });
    q.optionClass = 'ko';
  } else if (roll < 0.75){
    q.ask = '이 뜻을 가진 단어는?';
    q.promptHTML = '<div class="bigko">' + t.m + '</div>';
    q.answer = t.h;
    q.options = distract(pool, t, function(x){ return x.h; }, t.h,
                         function(x){ return x.cat === t.cat; });
    q.optionClass = 'han';
  } else {
    q.ask = '이 단어의 주음 표기는?';
    q.promptHTML = rubyHTML(t.h, t.z, 'noz');
    q.answer = t.z;
    q.options = distract(pool, t, function(x){ return x.z; }, t.z,
                         function(x){ return Array.from(x.h).length === Array.from(t.h).length; });
    q.optionClass = 'zhu';
  }
  return q;
}
function listenQuestion(){
  var pool = wordPool();
  var t = weightedPickBy(pool, function(x){ return x.h; });
  return {
    mode:'listen', key:t.h, word:t,
    ask:'들린 단어는 어느 것인가요?',
    promptHTML:'<div class="bigsym bignote">♪</div>',
    answer:t.h,
    options:distract(pool, t, function(x){ return x.h; }, t.h,
                     function(x){ return x.cat === t.cat; }),
    optionClass:'han',
    audio:t.h
  };
}
function makeQuestion(){
  switch (state.mode){
    case 'find':   return findQuestion();
    case 'tone':   return toneQuestion();
    case 'word':   return wordQuestion();
    case 'listen': return listenQuestion();
    default:       return symQuestion();
  }
}

/* ============ 화면 ============ */
function render(){
  var q = state.q;
  state.locked = false;
  $('ask').textContent = q.ask;
  $('reveal').hidden = true;
  $('seal').className = 'seal';
  $('prompt').innerHTML = q.promptHTML;
  $('subhint').textContent = q.hint || '';
  $('play').hidden = !(ttsOK && q.audio);

  var box = $('choices');
  box.innerHTML = '';
  q.options.forEach(function(opt, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice ' + (q.optionClass || '');
    var n = document.createElement('span');
    n.className = 'num'; n.textContent = String(i + 1);
    var t = document.createElement('span');
    if (q.optHTML) t.innerHTML = q.optHTML(opt); else t.textContent = opt;
    b.appendChild(n); b.appendChild(t);
    b.addEventListener('click', function(){ answer(opt, b); });
    box.appendChild(b);
  });

  if (q.mode === 'listen') setTimeout(function(){ speak(q.audio); }, 260);
}

function answer(value, btn){
  if (state.locked) return;
  state.locked = true;
  var q = state.q, ok = (value === q.answer);

  state.count++;
  if (ok){ state.right++; state.streak++; if (state.streak > state.best) state.best = state.streak; }
  else state.streak = 0;
  record(q.key, ok);
  updateScore();

  var seal = $('seal');
  seal.textContent = ok ? '正' : '再';
  seal.className = 'seal show' + (ok ? '' : ' no');

  Array.prototype.forEach.call($('choices').children, function(el){
    var label = el.lastChild.textContent;
    el.disabled = true;
    if (label === q.answer) el.classList.add('right');
    else if (el === btn) el.classList.add('wrong');
    else el.classList.add('dim');
  });

  var tone = $('r-tonebox');
  tone.hidden = true;
  $('r-tip').hidden = true;

  if (q.sym){
    var s = q.sym;
    $('r-ruby').innerHTML = '<div class="ruby sm"><span class="zi"><span class="han">' +
      glyphHTML(s) + '</span></span></div>';
    $('r-py').textContent = s.py;
    $('r-mean').innerHTML =
      (s.role === 'comp'
        ? (s.alt && s.alt !== '—'
            ? '<span class="rdline">자음 뒤에서는 <span class="alt">' + s.alt + '</span> — 주음 표기는 그대로</span>'
            : '')
        : '<span class="rdline">읽는 법 <b>' + s.read + '</b> ' + s.readPy + '</span>') +
      (s.ko === '(없음)' ? '한국어에 없는 소리' : '한국어 ' + s.ko + '에 가까움');
    $('r-desc').textContent = s.desc + '.';
    $('r-tip').innerHTML = '<b>' + s.gkr + '</b> · ' + ROLE[s.role].label +
      '　예시 ' + rubyInline(s.exH, s.exZ) + ' ' + s.exP + ' — ' + s.exM +
      (s.readNote ? '<br>' + s.readNote : '');
    $('r-tip').hidden = false;
  } else {
    var w = q.word;
    $('r-ruby').innerHTML = rubyHTML(w.h, w.z);
    $('r-py').textContent = w.py;
    $('r-mean').textContent = w.m;
    $('r-desc').textContent = '';
    if (q.mode === 'tone'){
      var mk = parseSyl(w.z.trim()).tone;
      var dot = w.z.trim().charAt(0) === '˙';
      var tn = TONES.filter(function(x){ return dot ? x.n === 0 : x.mark === mk; })[0] || TONES[0];
      $('r-tsvg').innerHTML = toneSVG(tn.contour);
      $('r-tname').textContent = tn.name + '（' + tn.zh + '）　' + tn.val;
      $('r-tdesc').textContent = tn.desc.replace(/\*\*/g, '');
      tone.hidden = false;
    }
    var tip = WORD_TIP[w.h];
    if (tip){ $('r-tip').textContent = tip; $('r-tip').hidden = false; }
  }
  $('reveal').hidden = false;
  if (q.mode !== 'listen') speak(q.audio);
  $('next').focus({preventScroll:true});
}
function rubyInline(han, zhu){
  return han + ' ' + zhu;
}

function updateScore(){
  $('s-streak').textContent = state.streak;
  $('s-streak').className = state.streak >= 5 ? 'hot' : '';
  $('s-count').textContent = state.count;
  $('s-acc').textContent = state.count ? Math.round(state.right / state.count * 100) + '%' : '—';

  if (b && !b.disabled) setMode(b.dataset.mode);
});
$('next').addEventListener('click', nextQ);
$('play').addEventListener('click', function(){ speak(state.q && state.q.audio); });
$('openchart').addEventListener('click', openChart);
$('closechart').addEventListener('click', closeChart);
$('seg').addEventListener('click', function(e){
  var b = e.target.closest('button[data-view]');
  if (!b) return;
  state.chartView = b.dataset.view;
  renderChart();
  window.scrollTo(0, 0);
});
document.addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$('sheet').hidden){ if (e.key === 'Escape') closeChart(); return; }
  if (e.key === 'Enter' || e.key === ' '){
    if (state.locked){ e.preventDefault(); nextQ(); }
    return;
  }
  if (e.key === 'r' || e.key === 'R'){ speak(state.q && state.q.audio); return; }
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && !state.locked){
    var el = $('choices').children[n - 1];
    if (el) el.click();
  }
});

/* ============ 시작 ============ */
function start(snap){
  load();
  if (snap && typeof snap === 'object'){
    if (typeof snap.count === 'number') state.count = snap.count;
    if (typeof snap.right === 'number') state.right = snap.right;
    if (typeof snap.streak === 'number') state.streak = snap.streak;
    if (snap.mode && snap.mode !== 'listen') state.mode = snap.mode;
  }
  syncModes(); renderChips(); updateScore(); updateAudioUI(); nextQ();
}
try{
  if (window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){
      return {count:state.count, right:state.right, streak:state.streak, mode:state.mode};
    });
  }
}catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready){
  window.claude.hot.ready(start);
} else {
  start((window.claude && window.claude.hot && window.claude.hot.data) || {});
}
})();
</script>
</body>
